<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>카페이야기 · 접근 제어 실습</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body>
<header><a class="brand" href="/">☕ 카페이야기</a><nav><a href="/">게시판</a><a href="/gold">골드 라운지</a><a href="/admin">관리자</a></nav><div class="identity">{% if g.user %}<strong>{{ g.user.username }}</strong><span class="badge">{{ roles[g.user.role] }} ({{ g.user.role }})</span><form action="/logout" method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}"><button class="quiet">로그아웃</button></form>{% else %}<span>비로그인</span><a href="/login">로그인</a><a href="/register">회원가입</a>{% endif %}</div></header>
<main>{% for message in get_flashed_messages() %}<div class="notice">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main><footer>카페이야기 · 접근 제어 확인용 테스트 · 권한은 매 요청마다 DB에서 확인합니다.</footer></body></html>
