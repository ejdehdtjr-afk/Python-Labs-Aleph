{% extends 'base.html' %}{% block content %}<section class="panel auth"><p class="eyebrow">CAFE STORY</p><h1>{{ '회원가입' if signup else '로그인' }}</h1><p class="muted">{{ '가입 시 일반(0) 등급이 자동 적용됩니다.' if signup else '로그인 후 헤더에서 이름과 현재 DB 권한을 확인하세요.' }}</p><form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}"><label>아이디<input name="username" minlength="2" maxlength="40" autocomplete="username" required></label><label>비밀번호<input name="password" type="password" minlength="8" maxlength="128" autocomplete="{{ 'new-password' if signup else 'current-password' }}" required></label><button>{{ '일반 회원으로 가입' if signup else '로그인' }}</button></form></section>{% endblock %}
